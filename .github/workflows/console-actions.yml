name: Build and test Impacket-Console

on:
  push:
    paths:
      - "console/**"
      - ".github/workflows/console-actions.yml"
  pull_request:
    paths:
      - "console/**"
      - ".github/workflows/console-actions.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest rich cmd2

      # Scoped to console/tests so this only ever runs the console's own
      # tests - a bare `pytest` from the repo root would also collect
      # impacket's own test suite (tests/), which needs live network
      # access and isn't what this workflow is for.
      - name: Run console tests
        run: pytest console/tests -v

